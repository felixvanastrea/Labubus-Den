  // ---------- feedback: the Google Form behind "Report a mistake" and "Ask the Labubu" (feedback.json) ----------
  // Links open the form in a new tab with the kind ticked and, for a mistake, the question filled in. The
  // question is also copied, in case the form doesn't fill. No form set: no buttons.
  const FB = BANK.feedback && BANK.feedback.form ? BANK.feedback : null;
  const LB_ICON = '<svg class="lb" aria-hidden="true" focusable="false"><use href="#labubu"/></svg>';
  const flat = h => stripTags(h).replace(/\s+/g, ' ').trim();
  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
  function formURL(kind, text) {
    const p = new URLSearchParams({ usp: 'pp_url' });
    p.set(FB.kind, FB.kinds[kind]);
    if (text) p.set(FB.question, clip(text, 1500));
    return FB.form + '?' + p;
  }
  // one line each for where it's from, the case, the stem, the options and the answer shown. Lines end in a space
  // so they still read apart if the form's box is a single line, which drops line breaks.
  function reportText(q) {
    const t = TOPIC.get(q.topic), c = CASE_OF(q);
    const lines = [`[${q.sid || q.id} · ${setLabel(q)}, Q${q.n}${t ? ' · ' + t.name : ''}]`];
    if (c) lines.push('Case: ' + clip(flat(c.html), 400));
    lines.push(flat(q.stem));
    q.options.forEach((o, i) => lines.push(`${LETTERS[i]}. ${flat(o)}`));
    lines.push(KEY_LONG[keyOf(q)] + (q.answer.length ? ': ' + letters(q.answer) : ''));
    return lines.join(' \n');
  }
  function reportHTML(q) {
    if (!FB) return '';
    return `<div class="qfoot"><a class="report" href="${esc(formURL('mistake', reportText(q)))}" target="_blank" rel="noopener" data-report="${esc(q.id)}">${LB_ICON}Report a mistake</a></div>`;
  }
  function askHTML(cls, label, icon) {
    if (!FB) return '';
    return `<a class="${cls}" href="${esc(formURL('idea'))}" target="_blank" rel="noopener" data-ask>${icon === false ? '' : LB_ICON}${label}</a>`;
  }
  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg; el.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 3200);
  }
  function copyReport(q) {
    try {
      const p = navigator.clipboard && navigator.clipboard.writeText(reportText(q));
      if (p && p.then) p.then(() => toast('Question copied, and the form opens in a new tab'), () => {});
    } catch (err) {}
  }

  // ---------- constellations in the quest ----------
  // a little constellation with one star per copy, joined by a line; the card says where each copy comes from
  function cstArt(n, seed) {
    const N = Math.min(n, 7), rnd = mulberry(hashStr(seed)), W = 10 + (N - 1) * 9;
    const pts = Array.from({ length: N }, (_, i) => [5 + i * 9, 4 + rnd() * 9]);
    const line = pts.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join('');
    const star = ([x, y]) => `<path class="cs" d="M${x.toFixed(1)} ${(y - 3.4).toFixed(1)}l.9 2.5 2.5.9-2.5.9-.9 2.5-.9-2.5-2.5-.9 2.5-.9z"/>`;
    return `<svg class="cst-art" viewBox="0 0 ${W} 17" width="${W}" height="17" aria-hidden="true" focusable="false"><path class="cl" d="${line}"/>${pts.map(star).join('')}</svg>`;
  }
  function soundBtn() {
    const on = sfx.sound();
    return `<button class="btn quiet toggle snd" type="button" data-act="sound" aria-pressed="${on}" title="${on ? 'Sounds on' : 'Sounds off'}">${on ? ICON.sound : ICON.mute}<span class="sr-label">Sounds</span></button>`;
  }
  function cstChip(q, stars) {
    return `<button type="button" class="cst-chip" data-act="cst" aria-expanded="false" aria-controls="cst-card">${cstArt(stars.length, q.id)}<span>Constellation · ${stars.length} stars</span></button>`;
  }
  function cstCard(q, stars) {
    const where = stars.map(id => { const x = Q.get(id); return `<li>${esc(setLabel(x))} · Q${esc(x.n)}</li>`; }).join('');
    return `<div class="cst-card" id="cst-card" role="region" aria-label="Constellation">
      <p class="cc-t">This question came up ${stars.length} times with the same propositions, so the ${S.session && S.session.lec ? 'lecture list' : 'quest'} groups the copies into one constellation. Answering it here counts once.</p>
      <ul class="cc-l">${where}</ul>
      <button type="button" class="btn cc-go" data-act="stars">Do all ${stars.length} stars ${ICON.next}</button>
    </div>`;
  }
  let cstTimer = null, sparkleAt = 0;
  function cstOpen(on, now) {
    const card = document.getElementById('cst-card'), chip = app.querySelector('.cst-chip');
    if (!card || !chip) return;
    clearTimeout(cstTimer);
    if (!on) {
      cstTimer = setTimeout(() => { card.classList.remove('on'); chip.setAttribute('aria-expanded', 'false'); }, now ? 0 : 160);
      return;
    }
    // under the chip, kept inside the question card
    const box = card.parentElement.getBoundingClientRect(), c = chip.getBoundingClientRect();
    card.style.top = (c.bottom - box.top + 8) + 'px';
    card.style.left = Math.max(12, Math.min(c.left - box.left, box.width - card.offsetWidth - 12)) + 'px';
    if (!card.classList.contains('on') && Date.now() - sparkleAt > 2000) { sparkleAt = Date.now(); sfx.play('sparkle', { quiet: true }); usage.track('constellation_opened'); }
    card.classList.add('on'); chip.setAttribute('aria-expanded', 'true');
  }

  // ---------- quiz ----------
  function caseHTML(q) {
    if (!q.case || !CASE.has(q.case)) return '';
    const c = CASE.get(q.case);
    if (q.caseOpen) return `<div class="case"><div class="case-h">Case</div><div class="case-b">${c.html}</div></div>`;
    return `<details class="case"><summary>Show the case</summary><div class="case-b">${c.html}</div></details>`;
  }
  function renderQuiz(focusWhat) {
    const sess = S.session;
    const q = curQ();
    const a = S.answers[q.id] || { sel: [], checked: false };
    const hasKey = q.answer.length > 0;
    const checked = hasKey && a.checked;
    const k = keyOf(q);
    const cells = sess.qids.map((id, i) => {
      const r = result(Q.get(id));
      const cls = ['cell', r === 'todo' ? '' : r, i === sess.idx ? 'cur' : ''].join(' ');
      const label = { right: 'right', wrong: 'wrong', nokey: 'no answer key', draft: 'started', todo: 'not answered' }[r];
      return `<button type="button" class="${cls}" data-jump="${i}" aria-label="Question ${i + 1}, ${label}"${i === sess.idx ? ' aria-current="true"' : ''}>${i + 1}</button>`;
    }).join('');
    const opts = q.options.map((html, i) => {
      const picked = a.sel.includes(i);
      const inKey = q.answer.includes(i);
      let cls = 'opt', bub = LETTERS[i], tag = '';
      if (checked) {
        if (picked && inKey) { cls += ' is-hit'; bub = ICON.check; tag = 'Your pick'; }
        else if (picked && !inKey) { cls += ' is-miss'; bub = ICON.cross; tag = 'Your pick'; }
        else if (!picked && inKey) { cls += ' is-missed'; tag = 'Missed'; }
        else cls += ' is-rest';
      }
      if (tag) cls += ' has-tag';
      const pressed = checked ? '' : ` aria-pressed="${picked}"`;
      const aria = checked ? ` aria-label="${LETTERS[i]}. ${esc(stripTags(html))}. ${inKey ? 'Correct answer' : 'Not in the answer'}${picked ? ', you picked it' : ''}"` : '';
      return `<button type="button" class="${cls}" data-opt="${i}" style="--i:${i}"${pressed}${aria}${checked ? ' aria-disabled="true"' : ''}>
        <span class="bub">${bub}</span><span class="otext">${html}</span><span class="otag">${tag}</span></button>`;
    }).join('');
    let verdict = '';
    if (!hasKey) {
      verdict = `<div class="verdict nokey" id="verdict" tabindex="-1"><span class="v-main">No answer key</span><span class="v-sub">Nothing is highlighted for this one in the doc, so it can't be graded yet.</span></div>`;
    } else if (checked) {
      const overlap = a.sel.filter(i => q.answer.includes(i)).length;
      const main = a.correct ? `${ICON.check} Correct` : (overlap ? `${ICON.cross} Partly right` : `${ICON.cross} Wrong`);

    if (S.view === 'home' && e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const inp = document.getElementById('q');
      if (inp && !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) { e.preventDefault(); inp.focus(); }
      return;
    }
    if (e.key === 'Escape') { const card = document.getElementById('cst-card'); if (card && card.classList.contains('on')) { cstOpen(false, true); const c = app.querySelector('.cst-chip'); if (c) c.focus(); return; } }
    if (S.view === 'exam') { examKey(e); return; }
    if (S.view !== 'quiz' || !S.session || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest('summary')) return;
    const key = e.key.toLowerCase();
    const q = curQ();
    let idx = -1;
    if (key.length === 1) idx = 'abcdefgh'.indexOf(key) !== -1 ? 'abcdefgh'.indexOf(key) : '12345678'.indexOf(key);
    if (idx !== -1 && idx < q.options.length) { e.preventDefault(); toggle(idx); return; }
    if (key === 'enter') {
      const ae = document.activeElement;
      if (ae && ae.tagName === 'A') return;   // Enter on a link follows it
      if (ae && ae.tagName === 'BUTTON' && !ae.closest('.opts') && ae.dataset.act !== 'primary') return;
      e.preventDefault(); primaryAction(); return;
    }
    if (key === 'arrowright') { e.preventDefault(); go(1); }
    if (key === 'arrowleft') { e.preventDefault(); go(-1); }
  });

  // the exam: A–E (or 1–5) pick, Enter goes on (and offers to hand in after the last question), arrows move;
  // while "Hand in your exam?" is open, Escape closes it and the keys are left to its buttons
  function examKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest('summary')) return;
    const scr = examScreen(), key = e.key.toLowerCase();
    if (scr === 'run') {
      if (examConfirm) {
        if (key === 'escape') { e.preventDefault(); examConfirm = false; render(false, 'next'); }
        return;
      }
      const q = examQ();
      let idx = -1;
      if (key.length === 1) idx = 'abcdefgh'.indexOf(key) !== -1 ? 'abcdefgh'.indexOf(key) : '12345678'.indexOf(key);
      if (idx !== -1 && idx < q.options.length) { e.preventDefault(); examToggle(idx); return; }
      if (key === 'enter') {
        const ae = document.activeElement;
        if (ae && ae.tagName === 'A') return;
        if (ae && ae.tagName === 'BUTTON' && !ae.closest('.opts') && ae.dataset.act !== 'exam-next') return;
        e.preventDefault(); examGo(1); return;
      }
    }
    if (scr === 'run' || scr === 'review') {
      if (key === 'arrowright') { e.preventDefault(); examGo(1); }
      if (key === 'arrowleft') { e.preventDefault(); examGo(-1); }
    }
  }

  let resizeT = null, lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      sky.resize();
      if (S.view === 'home' && window.innerWidth !== lastW) { drawTitle(false); drawMilky(); drawVortex(); }
      lastW = window.innerWidth;
    }, 160);
  });

  // ---------- lightbox ----------
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  let lbReturn = null;
  function openLightbox(src) {
    lbReturn = document.activeElement;
    lbImg.src = src; lb.classList.remove('actual'); lb.hidden = false;
    document.getElementById('lb-close').focus();
  }
  function closeLightbox() {
    lb.hidden = true; lbImg.removeAttribute('src');
    if (lbReturn && lbReturn.focus) lbReturn.focus({ preventScroll: true });
  }
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  lbImg.addEventListener('click', e => { e.stopPropagation(); lb.classList.toggle('actual'); });
  document.getElementById('lb-body').addEventListener('click', e => { if (e.target.id === 'lb-body') closeLightbox(); });

  // ---------- boot ----------
  function start(data) {
    load();
    if (data && data.S && !storageOK) { S = Object.assign(S, data.S); sanitize(); }
    usage.boot();   // first, so an exam handed in on load is counted too
    acct.boot();
    examBoot();
    if (S.view === 'home') { S.q = ''; S.aspect = null; }   // a fresh visit opens on the modules, not an old search
    // the opening animation plays when the site opens on the home page (not for automated page captures)
    const opening = S.view === 'home' && introOn() && !reduceMotion() && (!navigator.webdriver || location.hash === '#intro');
    titleHold = opening;
    render(false);
    if (opening && intro.play()) return;   // the intro starts the sky when its star lands
    releaseTitle();
    app.classList.add('first');
    setTimeout(() => app.classList.remove('first'), 1800);
    sky.start();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ S })); } catch (e) {} }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
