      case 'resume': resume(); break;
      case 'primary': primaryAction(); break;
      case 'prev': go(-1); break;
      case 'again': tryAgain(); break;
      case 'shuffle': toggleShuffle(); break;
      case 'mistakes': retryMistakes(); break;
      case 'restart': restartSession(); break;
      case 'review': jump(0); break;
      case 'reset': confirmReset = t.dataset.scope || 'all'; render(false); break;
      case 'reset-no': confirmReset = false; render(false); break;
      case 'reset-yes': doReset(confirmReset || 'all'); break;
      case 'intro-toggle': {
        const v = !introOn();
        introPref = v;
        try { localStorage.setItem(INTRO_KEY, v ? 'on' : 'off'); } catch (err) {}
        t.setAttribute('aria-checked', String(v)); t.textContent = v ? 'on' : 'off';
        sfx.play('toggle', { quiet: true });
        break;
      }
      case 'intro-replay': replayIntro(); break;
      case 'sound': case 'sound-toggle': {
        sfx.setSound(!sfx.sound());
        const on = sfx.sound();
        usage.track('sound_switched', { on });
        app.querySelectorAll('[data-act="sound"]').forEach(b => { b.setAttribute('aria-pressed', String(on)); b.title = on ? 'Sounds on' : 'Sounds off'; b.innerHTML = (on ? ICON.sound : ICON.mute) + '<span class="sr-label">Sounds</span>'; });
        app.querySelectorAll('[data-act="sound-toggle"]').forEach(b => { b.setAttribute('aria-checked', String(on)); b.textContent = on ? 'on' : 'off'; });
        break;
      }
      case 'rmoon': t.classList.toggle('on'); usage.track('moon_opened'); break;
      case 'haptic-toggle': sfx.setHaptics(!sfx.haptics()); t.setAttribute('aria-checked', String(sfx.haptics())); t.textContent = sfx.haptics() ? 'on' : 'off'; break;
      case 'stats-toggle': usage.set(!usage.on()); t.setAttribute('aria-checked', String(usage.on())); t.textContent = usage.on() ? 'on' : 'off'; sfx.play('toggle', { quiet: true }); break;
      case 'cst': { const card = document.getElementById('cst-card'); cstOpen(canHover() || !(card && card.classList.contains('on')), true); break; }
      case 'stars': practiceStars(curQ().id); break;
      case 'exam': openExam(QUEST ? { kind: 'quest', id: QUEST.id } : null); break;
      case 'exam-resume': openExam(); break;
      case 'exam-module': openExam({ kind: 'module', id: S.topicId }); break;
      case 'weak': openWeak(t.dataset.mod || (S.view === 'topic' ? S.topicId : null)); break;
      case 'weak-module': openWeak(S.topicId); break;
      case 'comets': startComets(null, 'home'); break;
      case 'diag-comets': { const i = DIAG_INDEX.get(S.diag); startComets(k => DIAG_OF.get(k) === i, 'diag'); break; }
      case 'diag-untried': untriedTopic(S.diag); break;
      case 'diag-exam': openExam({ kind: 'topic', id: S.diag }); break;
      case 'diag-all': S.diagAll = true; save(); render(false); break;
      case 'account': acct.open(); break;
      case 'sky-hide': acct.toggleSky(); break;
      case 'sky-spark': acct.sendSpark(t.dataset.uid); break;
      case 'challenge': acct.openChallenge(t.dataset.kind || 'duel'); break;
      case 'duel-play': acct.duelPlay(S.duelId); break;
      case 'duel-go': acct.duelGo(S.duelId); break;
      case 'duel-copy': acct.duelCopy(); break;
      case 'duel-share': acct.duelShare(); break;
      case 'duel-rematch': acct.rematch(S.duelId); break;
      case 'diag-back': S.view = 'topic'; S.diagFrom = 'weak'; save(); render(true, null, 'back'); break;
      case 'exam-start': startExam(); break;
      case 'exam-back': examBack(); break;
      case 'exam-next': examGo(1); break;
      case 'exam-prev': examGo(-1); break;
      case 'exam-handin': askHandIn(); break;
      case 'exam-keep': examConfirm = false; render(false, 'next'); break;
      case 'exam-handin-yes': handIn(false); break;
      case 'exam-results': openExamResults(); break;
      case 'exam-review': usage.track('exam_review_opened'); examJump(0); break;
      case 'exam-new': if (S.exam && scopeInfo(S.exam.scope)) S.examScope = S.exam.scope; S.examScreen = 'intro'; save(); render(true, null, 'nav'); break;
    }
  });

  let saveTimer = null, searchStatT = null;
  app.addEventListener('input', e => {
    if (e.target.id !== 'q') return;
    const del = /^delete/.test(e.inputType || ''), last = e.target.value.slice(-1);
    sfx.play(del ? 'untick' : last === ' ' ? 'space' : 'type', { quiet: true, gain: 0.8 });
    S.q = e.target.value; S.aspect = null; kwAll = false;
    if (secretCode(S.q)) { S.q = ''; e.target.value = ''; e.target.blur(); updateSearch(); elPsyKongroo(); return; }
    if (secretCode(S.q, 8, '1lvs78d')) { S.q = ''; e.target.value = ''; e.target.blur(); updateSearch(); redaSwap(); return; }
    updateSearch();
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 400);
    // what people look for (once they stop typing), to see which searches come up empty
    clearTimeout(searchStatT);
    searchStatT = setTimeout(() => {
      const q = (S.q || '').trim();
      if (q.length >= 2) usage.track('search', { query: q.slice(0, 60), results: (lastLists.h || []).length + (lastLists.k || []).length });
    }, 1500);
  });

  document.addEventListener('keydown', e => {
    if (intro.active()) return;
    if (!lb.hidden) { if (e.key === 'Escape') closeLightbox(); return; }
    const inSearch = e.target && e.target.id === 'q';
    if (inSearch) {
      if (e.key === 'Escape' && S.q) { e.preventDefault(); S.q = ''; S.aspect = null; e.target.value = ''; save(); updateSearch(); }
      else if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
      return;
    }
    if (S.view === 'home' && e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const inp = document.getElementById('q');
      if (inp && !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) { e.preventDefault(); inp.focus(); }
      return;
    }
    if (e.key === 'Escape') { const card = document.getElementById('cst-card'); if (card && card.classList.contains('on')) { cstOpen(false, true); const c = app.querySelector('.cst-chip'); if (c) c.focus(); return; } }
    if (S.view === 'exam') { examKey(e); return; }
    if (S.view !== 'quiz' || !S.session || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest('summary')) return;
    const key = e.key.toLowerCase();
    const q = curQ();
    const xi = crossKey(e);
    if (xi !== -1) { if (xi < q.options.length) { e.preventDefault(); crossToggle(xi); } return; }
    if (key === 'm' && !e.shiftKey) { e.preventDefault(); markToggle(); return; }
    let idx = -1;
    if (key.length === 1) idx = 'abcdefgh'.indexOf(key) !== -1 ? 'abcdefgh'.indexOf(key) : '12345678'.indexOf(key);
    if (idx !== -1 && idx < q.options.length) { e.preventDefault(); toggle(idx); return; }
    if (key === 'enter') {
      const ae = document.activeElement;
      if (ae && ae.tagName === 'A') return;   // Enter on a link follows it
      if (ae && ae.tagName === 'BUTTON' && !ae.closest('.opts') && ae.dataset.act !== 'primary') return;
      e.preventDefault(); primaryAction(); return;
    }
    if (key === 'arrowright') { e.preventDefault(); go(1); }
    if (key === 'arrowleft') { e.preventDefault(); go(-1); }
  });

  // Shift + a letter (or a number): the option to cross out, else -1
  function crossKey(e) {
    if (!e.shiftKey || !e.code) return -1;
    const m = e.code.match(/^Key([A-H])$|^Digit([1-8])$/);
    return m ? (m[1] ? m[1].charCodeAt(0) - 65 : +m[2] - 1) : -1;
  }
  // the exam: A–E (or 1–5) pick, Enter goes on (and offers to hand in after the last question), arrows move;
  // while "Hand in your exam?" is open, Escape closes it and the keys are left to its buttons
  function examKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest('summary')) return;
    const scr = examScreen(), key = e.key.toLowerCase();
    if (scr === 'run') {
      if (examConfirm) {
        if (key === 'escape') { e.preventDefault(); examConfirm = false; render(false, 'next'); }
        return;
      }
      const q = examQ();
      const xi = crossKey(e);
      if (xi !== -1) { if (xi < q.options.length) { e.preventDefault(); crossToggle(xi); } return; }
      if (key === 'm' && !e.shiftKey) { e.preventDefault(); markToggle(); return; }
      let idx = -1;
      if (key.length === 1) idx = 'abcdefgh'.indexOf(key) !== -1 ? 'abcdefgh'.indexOf(key) : '12345678'.indexOf(key);
      if (idx !== -1 && idx < q.options.length) { e.preventDefault(); examToggle(idx); return; }
      if (key === 'enter') {
        const ae = document.activeElement;
        if (ae && ae.tagName === 'A') return;
        if (ae && ae.tagName === 'BUTTON' && !ae.closest('.opts') && ae.dataset.act !== 'exam-next') return;
        e.preventDefault(); examGo(1); return;
      }
    }
    if (scr === 'run' || scr === 'review') {
      if (key === 'arrowright') { e.preventDefault(); examGo(1); }
      if (key === 'arrowleft') { e.preventDefault(); examGo(-1); }
    }
  }

  let resizeT = null, lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      sky.resize();
      if (S.view === 'home' && window.innerWidth !== lastW) { drawTitle(false); drawMilky(); drawVortex(); }
      lastW = window.innerWidth;
    }, 160);
  });

  // ---------- lightbox ----------
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  let lbReturn = null;
  function openLightbox(src) {
    lbReturn = document.activeElement;
    lbImg.src = src; lb.classList.remove('actual'); lb.hidden = false; sfx.play('sheet', { quiet: true });
    document.getElementById('lb-close').focus();
  }
  function closeLightbox() {
    lb.hidden = true; lbImg.removeAttribute('src'); sfx.play('shut', { quiet: true });
    if (lbReturn && lbReturn.focus) lbReturn.focus({ preventScroll: true });
  }
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  lbImg.addEventListener('click', e => { e.stopPropagation(); lb.classList.toggle('actual'); });
  document.getElementById('lb-body').addEventListener('click', e => { if (e.target.id === 'lb-body') closeLightbox(); });

  // a challenge's page (from its link, the homepage or an invitation); it needs an account
  function openDuel(id) {
    if (!/^[a-z0-9]{6,24}$/.test(id || '')) return;
    if (acct.gate('Duels and parties need an account', () => openDuel(id))) return;
    S.duelId = id; S.view = 'duel'; confirmReset = false; save(); render(true, null, 'nav');
  }
  const duelHash = () => { const m = /^#duel-([a-z0-9]{6,24})$/.exec(location.hash || ''); if (m) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} return m ? m[1] : null; };
  window.addEventListener('hashchange', () => { const id = duelHash(); if (id) openDuel(id); });

  // ---------- boot ----------
  function start(data) {
    load();
    if (data && data.S && !storageOK) { S = Object.assign(S, data.S); sanitize(); }
    usage.boot();   // first, so an exam handed in on load is counted too
    acct.boot();
    examBoot();
    if (S.view === 'home') { S.q = ''; S.aspect = null; }   // a fresh visit opens on the modules, not an old search
    const dh = duelHash();
    if (dh && acct.member()) { S.view = 'duel'; S.duelId = dh; }
    else if (dh) setTimeout(() => openDuel(dh), 400);
    // the opening animation plays when the site opens on the home page (not for automated page captures)
    const opening = !dh && S.view === 'home' && introOn() && !reduceMotion() && (!navigator.webdriver || /#intro$/.test(location.hash));
    titleHold = opening;
    skyclock.start();
    render(false);
    if (opening && intro.play()) return;   // the intro starts the sky when its star lands
    releaseTitle();
    app.classList.add('first');
    setTimeout(() => app.classList.remove('first'), 1800);
    sky.start();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ S })); } catch (e) {} }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
